<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOL Foreign Employment — Worker Tracking System</title>
<style>
:root{
--ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
--brand:#0d9488; --brand-dark:#0f766e; --danger:#dc2626;
}
*{box-sizing:border-box}
body{
margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
background:#f1f5f9; color:var(--ink); font-size:14px;
}

/* ---------- Top bar ---------- */
.topbar{
background:linear-gradient(135deg,#0f766e,#115e59); color:#fff;
padding:14px 22px; display:flex; flex-wrap:wrap; gap:12px;
align-items:center; justify-content:space-between;
position:sticky; top:0; z-index:50; box-shadow:0 2px 12px rgba(0,0,0,.18);
}
.brand{display:flex; align-items:center; gap:12px}
.logo{
width:46px; height:46px; border-radius:13px; background:#fff; color:#0f766e;
font-weight:800; display:grid; place-items:center; font-size:15px; letter-spacing:.5px;
}
.brand h1{font-size:16px; margin:0; font-weight:700}
.brand p{margin:2px 0 0; font-size:12px; opacity:.85}
.topbar-actions{display:flex; gap:8px; flex-wrap:wrap}

/* ---------- Buttons ---------- */
.btn{
border:1px solid #cbd5e1; background:#fff; color:var(--ink);
padding:8px 14px; border-radius:9px; font-size:13px; font-weight:600;
cursor:pointer; transition:.15s; font-family:inherit;
}
.btn:hover{background:#f8fafc}
.btn-primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-danger{background:var(--danger); border-color:var(--danger); color:#fff}
.btn-danger:hover{background:#b91c1c}
.topbar .btn{border-color:rgba(255,255,255,.35); background:rgba(255,255,255,.12); color:#fff}
.topbar .btn:hover{background:rgba(255,255,255,.25)}
.topbar .btn-primary{background:#fff; color:#0f766e; border-color:#fff}
.topbar .btn-primary:hover{background:#f0fdfa}

/* ---------- Layout ---------- */
main{max-width:1400px; margin:0 auto; padding:22px}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:18px}
.stat{background:#fff; border:1px solid var(--line); border-left:4px solid var(--brand);
border-radius:14px; padding:16px 18px}
.stat .n{font-size:27px; font-weight:800; line-height:1}
.stat .l{font-size:11px; color:var(--muted); margin-top:7px;
text-transform:uppercase; letter-spacing:.06em; font-weight:700}
.stat.blue{border-left-color:#0284c7}
.stat.amber{border-left-color:#d97706}
.stat.green{border-left-color:#16a34a}

.toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.toolbar input,.toolbar select{
padding:9px 12px; border:1px solid #cbd5e1; border-radius:9px;
font-size:13px; font-family:inherit; background:#fff; color:var(--ink);
}
.toolbar input{flex:1; min-width:220px}
.toolbar input:focus,.toolbar select:focus{outline:2px solid #99f6e4; border-color:var(--brand)}

.panel{background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden}
.table-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; min-width:980px}
th{
text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
color:var(--muted); padding:12px 14px; background:#f8fafc;
border-bottom:1px solid var(--line); white-space:nowrap;
}
td{padding:12px 14px; border-bottom:1px solid #f1f5f9; vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8fafc}

.who{font-weight:700}
.sub{font-size:12px; color:var(--muted); margin-top:2px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px}

.bar{height:7px; background:#e2e8f0; border-radius:99px; overflow:hidden; min-width:110px; margin-top:5px}
.bar > i{display:block; height:100%; background:linear-gradient(90deg,#14b8a6,#0d9488); border-radius:99px}

.badge{display:inline-block; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:700; white-space:nowrap}
.badge.new{background:#e0f2fe; color:#0369a1}
.badge.prog{background:#fef3c7; color:#b45309}
.badge.done{background:#dcfce7; color:#15803d}

.row-actions{display:flex; gap:6px}
.icon-btn{
border:1px solid #cbd5e1; background:#fff; border-radius:8px;
padding:5px 9px; font-size:12px; cursor:pointer; font-weight:600; font-family:inherit;
}
.icon-btn:hover{background:#f1f5f9}
.icon-btn.del:hover{background:#fee2e2; border-color:#fca5a5; color:#b91c1c}

.empty{padding:60px 20px; text-align:center; color:var(--muted)}
.empty h3{margin:0 0 6px; color:#334155}

/* ---------- Modal ---------- */
.modal-backdrop{
position:fixed; inset:0; background:rgba(15,23,42,.55); display:none;
align-items:flex-start; justify-content:center; padding:24px 16px;
overflow-y:auto; z-index:100;
}
.modal-backdrop.open{display:flex}
.modal{
background:#fff; border-radius:16px; width:100%; max-width:1020px;
box-shadow:0 24px 60px rgba(0,0,0,.35); animation:pop .18s ease-out;
}
@keyframes pop{from{transform:translateY(-10px); opacity:.5} to{transform:none; opacity:1}}
.modal-head{display:flex; justify-content:space-between; align-items:center;
padding:18px 22px; border-bottom:1px solid var(--line)}
.modal-head h2{margin:0; font-size:17px}
.modal-body{padding:20px 22px; max-height:calc(100vh - 230px); overflow-y:auto}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:14px 22px;
border-top:1px solid var(--line); background:#f8fafc; border-radius:0 0 16px 16px}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px}
@media(max-width:860px){ .form-grid{grid-template-columns:1fr} }

.section-title{
font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.07em;
color:var(--brand-dark); margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid #ccfbf1;
}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px}
.field label{font-size:12px; font-weight:600; color:#475569}
.field input,.field select,.field textarea{
padding:9px 11px; border:1px solid #cbd5e1; border-radius:9px;
font-size:13px; font-family:inherit; width:100%;
}
.field textarea{resize:vertical; min-height:66px}
.field input:focus,.field select:focus,.field textarea:focus{
outline:2px solid #99f6e4; border-color:var(--brand)
}

.stage-row{
display:grid; grid-template-columns:1fr 138px 1fr; gap:8px; align-items:center;
padding:9px; border:1px solid var(--line); border-radius:10px;
margin-bottom:8px; background:#fff; transition:.15s;
}
.stage-row.done{background:#f0fdfa; border-color:#5eead4}
.stage-row .chk{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; cursor:pointer}
.stage-row input[type=checkbox]{width:16px; height:16px; accent-color:var(--brand); cursor:pointer; flex:none}
.stage-row input[type=date],.stage-row input[type=text]{
padding:6px 8px; border:1px solid #cbd5e1; border-radius:7px;
font-size:12px; font-family:inherit; width:100%;
}
@media(max-width:860px){ .stage-row{grid-template-columns:1fr} }

.hint{font-size:12px; color:var(--muted); margin-top:10px; line-height:1.5}

/* ---------- Print ---------- */
@media print{
.topbar,.toolbar,.stats,.row-actions,.col-actions{display:none!important}
body{background:#fff}
main{padding:0; max-width:none}
.panel{border:none; border-radius:0}
table{min-width:0; font-size:11px}
th,td{padding:6px 8px}
}
</style>
</head>
<body>

<header class="topbar">
<div class="brand">
<div class="logo">SOL</div>
<div>
<h1>SOL Foreign Employment Agency</h1>
<p>Worker Processing &amp; Tracking System</p>
</div>
</div>
<div class="topbar-actions">
<button class="btn btn-primary" id="btnAdd">+ New Worker</button>
<button class="btn" id="btnExport">Export</button>
<button class="btn" id="btnImport">Import</button>
<button class="btn" id="btnCsv">CSV</button>
<button class="btn" id="btnPrint">Print</button>
<input type="file" id="fileInput" accept=".json" hidden>
</div>
</header>

<main>
<section class="stats" id="stats"></section>

<section class="toolbar">
<input id="search" type="search" placeholder="Search by name, passport no, phone, employer or job…">
<select id="filterStage"><option value="">All stages</option></select>
<select id="filterStatus">
<option value="">All statuses</option>
<option value="new">New</option>
<option value="prog">In Progress</option>
<option value="done">Completed</option>
</select>
</section>

<section class="panel">
<div class="table-wrap">
<table>
<thead>
<tr>
<th>ID</th>
<th>Worker</th>
<th>Contact</th>
<th>Employer / Job</th>
<th>Progress</th>
<th>Current Stage</th>
<th>Status</th>
<th class="col-actions">Actions</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>
<div id="emptyState" class="empty" hidden>
<h3>No workers found</h3>
<p>Click <strong>+ New Worker</strong> to register the first applicant.</p>
</div>
</section>
</main>

<!-- ============ MODAL ============ -->
<div class="modal-backdrop" id="modal">
<div class="modal">
<div class="modal-head">
<h2 id="modalTitle">New Worker</h2>
<button class="icon-btn" id="btnClose">✕ Close</button>
</div>
<div class="modal-body" id="modalBody"></div>
<div class="modal-foot">
<button class="btn" id="btnCancel">Cancel</button>
<button class="btn btn-primary" id="btnSave">Save Worker</button>
</div>
</div>
</div>

<script>
/* =========================================================
SOL FOREIGN EMPLOYMENT — WORKER TRACKING SYSTEM
Data is stored in the browser (localStorage).
========================================================= */

const STORAGE_KEY = 'sol_fe_workers_v1';

/* The 10 processing stages, in order */
const STAGES = [
{ key:'passport', label:'Passport Submitted' },
{ key:'cv', label:'CV Prepared' },
{ key:'registered', label:'Applicant Registered' },
{ key:'eligible', label:'Eligibility Verified' },
{ key:'training', label:'Training Completed' },
{ key:'selected', label:'Selected by Saudi Employer' },
{ key:'medical', label:'Medical Examination Passed' },
{ key:'visa', label:'Visa Processed' },
{ key:'clearance', label:'Travel Clearance Obtained' },
{ key:'traveled', label:'Traveled to Saudi Arabia' }
];

/* ---------- State ---------- */
let workers = [];
let editingId = null;
const filters = { q:'', stage:'', status:'' };

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function today(){
const d = new Date();
return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function addDays(n){
const d = new Date();
d.setDate(d.getDate() + n);
return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function fmtDate(iso){
if(!iso) return '—';
const d = new Date(iso + 'T00:00:00');
if(isNaN(d)) return iso;
return d.toLocaleDateString(undefined, {day:'2-digit', month:'short', year:'numeric'});
}
function download(filename, content, type){
const blob = new Blob([content], { type });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url; a.download = filename;
document.body.appendChild(a); a.click(); a.remove();
URL.revokeObjectURL(url);
}

/* ---------- Worker factory ---------- */
function blankWorker(){
const stages = {};
STAGES.forEach(s => stages[s.key] = { done:false, date:'', note:'' });
return {
id:'', name:'', passportNo:'', nationality:'', gender:'', dob:'',
phone:'', email:'', employer:'', job:'', agent:'', notes:'',
createdAt:'', updatedAt:'', stages
};
}

function normalize(w){
const base = blankWorker();
const out = Object.assign(base, w || {});
out.stages = out.stages || {};
STAGES.forEach(s => {
const st = out.stages[s.key] || {};
out.stages[s.key] = {
done: !!st.done,
date: st.date || '',
note: st.note || ''
};
});
return out;
}

function nextId(){
let max = 0;
workers.forEach(w => {
const m = /SOL-(\d+)/.exec(w.id || '');
if(m) max = Math.max(max, parseInt(m[1], 10));
});
return 'SOL-' + String(max + 1).padStart(4, '0');
}

/* ---------- Progress ---------- */
function progressOf(w){
let done = 0;
STAGES.forEach(s => { if(w.stages[s.key] && w.stages[s.key].done) done++; });
return { done, pct: Math.round(done / STAGES.length * 100) };
}
function statusOf(w){
const p = progressOf(w).done;
if(p === 0) return { cls:'new', label:'New' };
if(p === STAGES.length) return { cls:'done', label:'Completed' };
return { cls:'prog', label:'In Progress' };
}
function currentStage(w){
const s = STAGES.find(s => !w.stages[s.key].done);
return s ? s.label : 'Completed ✔';
}

/* ---------- Persistence ---------- */
function load(){
let raw = null;
try { raw = localStorage.getItem(STORAGE_KEY); } catch(e) { raw = null; }
if(raw === null){ workers = demoData(); save(); return; }
try {
const parsed = JSON.parse(raw);
workers = Array.isArray(parsed) ? parsed.map(normalize) : [];
} catch(e){
workers = [];
}
}
function save(){
try { localStorage.setItem(STORAGE_KEY, JSON.stringify(workers)); }
catch(e){ alert('Could not save data in this browser.'); }
}

/* ---------- Demo data (first run only) ---------- */
function demoData(){
const seed = [
{ name:'Ahmed Hassan Ali', passportNo:'EP1234567', nationality:'Ethiopian',
gender:'Male', phone:'+251 91 234 5678', employer:'Al Rajhi Construction',
job:'Mason', agent:'Addis Branch', done:6 },
{ name:'Maria Santos Cruz', passportNo:'PH7788991', nationality:'Filipino',
gender:'Female', phone:'+63 917 555 0192', employer:'Saudi Home Care Co.',
job:'Domestic Worker', agent:'Manila Partner', done:9 },
{ name:'Yusuf Ibrahim Khan', passportNo:'BD4455662', nationality:'Bangladeshi',
gender:'Male', phone:'+880 171 223 4455', employer:'Saudi Electricity Co.',
job:'Electrician', agent:'Dhaka Partner', done:2 },
{ name:'Grace Wanjiru Kimani', passportNo:'KE3344556', nationality:'Kenyan',
gender:'Female', phone:'+254 722 334 455', employer:'Riyadh Cleaning Services',
job:'Cleaner', agent:'Nairobi Branch', done:0 }
];

return seed.map((s, idx) => {
const w = blankWorker();
w.id = 'SOL-' + String(idx + 1).padStart(4, '0');
w.name = s.name; w.passportNo = s.passportNo; w.nationality = s.nationality;
w.gender = s.gender; w.phone = s.phone; w.employer = s.employer;
w.job = s.job; w.agent = s.agent;
w.createdAt = addDays(-70 + idx * 10);
w.updatedAt = today();
STAGES.forEach((st, i) => {
if(i < s.done){
w.stages[st.key] = { done:true, date: addDays(-60 + i * 5), note:'' };
}
});
return w;
});
}

/* =========================================================
RENDERING
========================================================= */
function render(){
renderStats();
renderTable();
}

function renderStats(){
const total = workers.length;
const fresh = workers.filter(w => progressOf(w).done === 0).length;
const done = workers.filter(w => progressOf(w).done === STAGES.length).length;
const inprog = total - fresh - done;

$('#stats').innerHTML = `
<div class="stat">
<div class="n">${total}</div>
<div class="l">Total Workers</div>
</div>
<div class="stat blue">
<div class="n">${fresh}</div>
<div class="l">New Applicants</div>
</div>
<div class="stat amber">
<div class="n">${inprog}</div>
<div class="l">In Progress</div>
</div>
<div class="stat green">
<div class="n">${done}</div>
<div class="l">Completed / Traveled</div>
</div>
`;
}

function visibleWorkers(){
const q = filters.q.toLowerCase().trim();
return workers.filter(w => {
if(q){
const hay = [w.id, w.name, w.passportNo, w.phone, w.employer, w.job, w.agent, w.nationality]
.join(' ').toLowerCase();
if(!hay.includes(q)) return false;
}
if(filters.stage && w.stages[filters.stage].done) return false;
if(filters.status && statusOf(w).cls !== filters.status) return false;
return true;
});
}

function renderTable(){
const list = visibleWorkers();
const tbody = $('#tbody');

if(list.length === 0){
tbody.innerHTML = '';
$('#emptyState').hidden = false;
return;
}
$('#emptyState').hidden = true;

tbody.innerHTML = list.map(w => {
const p = progressOf(w);
const st = statusOf(w);
return `
<tr>
<td class="mono">${esc(w.id)}</td>
<td>
<div class="who">${esc(w.name || '—')}</div>
<div class="sub">${esc(w.passportNo || 'No passport no.')}</div>
</td>
<td>
<div>${esc(w.phone || '—')}</div>
<div class="sub">${esc(w.nationality || '—')}</div>
</td>
<td>
<div>${esc(w.employer || '—')}</div>
<div class="sub">${esc(w.job || '—')}</div>
</td>
<td>
<div class="mono">${p.done}/${STAGES.length} steps</div>
<div class="bar"><i style="width:${p.pct}%"></i></div>
</td>
<td>${esc(currentStage(w))}</td>
<td><span class="badge ${st.cls}">${st.label}</span></td>
<td class="col-actions">
<div class="row-actions">
<button class="icon-btn" data-act="edit" data-id="${esc(w.id)}">Open</button>
<button class="icon-btn del" data-act="del" data-id="${esc(w.id)}">Delete</button>
</div>
</td>
</tr>`;
}).join('');
}

/* =========================================================
MODAL / FORM
========================================================= */
function openModal(id){
editingId = id || null;
const w = id ? workers.find(x => x.id === id) : blankWorker();
if(!w) return;

$('#modalTitle').textContent = id
? 'Worker Details — ' + w.id
: 'Register New Worker';
$('#modalBody').innerHTML = buildForm(w);
$('#modal').classList.add('open');
document.body.style.overflow = 'hidden';
setTimeout(() => { const f = $('#f_name'); if(f) f.focus(); }, 60);
}

function closeModal(){
$('#modal').classList.remove('open');
document.body.style.overflow = '';
editingId = null;
}

function buildForm(w){
const v = k => esc(w[k] || '');

const genderOpts = ['', 'Male', 'Female'].map(g =>
`<option value="${g}" ${w.gender === g ? 'selected' : ''}>${g || '— select —'}</option>`
).join('');

const stagesHtml = STAGES.map((s, i) => {
const st = w.stages[s.key];
return `
<div class="stage-row ${st.done ? 'done' : ''}" data-row="${s.key}">
<label class="chk">
<input type="checkbox" data-stage="${s.key}" ${st.done ? 'checked' : ''}>
<span>${i + 1}. ${s.label}</span>
</label>
<input type="date" data-date="${s.key}" value="${esc(st.date)}" title="Completion date">
<input type="text" data-note="${s.key}" value="${esc(st.note)}" placeholder="Note / reference">
</div>`;
}).join('');

return `
<div class="form-grid">
<div>
<h3 class="section-title">Worker Information</h3>

<div class="field">
<label>Full Name *</label>
<input id="f_name" type="text" value="${v('name')}" placeholder="e.g. Ahmed Hassan Ali">
</div>

<div class="field">
<label>Passport Number</label>
<input id="f_passportNo" type="text" value="${v('passportNo')}" placeholder="e.g. EP1234567">
</div>

<div class="field">
<label>Nationality</label>
<input id="f_nationality" type="text" value="${v('nationality')}" placeholder="e.g. Ethiopian">
</div>

<div class="field">
<label>Gender</label>
<select id="f_gender">${genderOpts}</select>
</div>

<div class="field">
<label>Date of Birth</label>
<input id="f_dob" type="date" value="${v('dob')}">
</div>

<div class="field">
<label>Phone</label>
<input id="f_phone" type="tel" value="${v('phone')}" placeholder="+251 …">
</div>

<div class="field">
<label>Email</label>
<input id="f_email" type="email" value="${v('email')}" placeholder="name@email.com">
</div>

<div class="field">
<label>Saudi Employer</label>
<input id="f_employer" type="text" value="${v('employer')}" placeholder="Company name">
</div>

<div class="field">
<label>Job Position</label>
<input id="f_job" type="text" value="${v('job')}" placeholder="e.g. Mason">
</div>

<div class="field">
<label>Agent / Branch</label>
<input id="f_agent" type="text" value="${v('agent')}" placeholder="Local agent or branch">
</div>

<div class="field">
<label>General Notes</label>
<textarea id="f_notes" placeholder="Any remarks about this worker…">${v('notes')}</textarea>
</div>
</div>

<div>
<h3 class="section-title">Processing Stages</h3>
${stagesHtml}
<p class="hint">
Tick a stage when it is finished — today's date is filled in automatically.
Untick to mark it as pending again.
</p>
</div>
</div>
`;
}

/* ---------- Save worker from modal ---------- */
function saveWorker(){
const val = id => ($('#' + id)?.value || '').trim();

const name = val('f_name');
if(!name){ alert('Please enter the worker\'s full name.'); return; }

const stages = {};
STAGES.forEach(s => {
const cb = document.querySelector(`input[data-stage="${s.key}"]`);
const date = document.querySelector(`input[data-date="${s.key}"]`);
const note = document.querySelector(`input[data-note="${s.key}"]`);
stages[s.key] = {
done: cb ? cb.checked : false,
date: date ? date.value : '',
note: note ? note.value.trim() : ''
};
});

const data = {
name,
passportNo : val('f_passportNo'),
nationality: val('f_nationality'),
gender : val('f_gender'),
dob : val('f_dob'),
phone : val('f_phone'),
email : val('f_email'),
employer : val('f_employer'),
job : val('f_job'),
agent : val('f_agent'),
notes : val('f_notes'),
stages,
updatedAt : today()
};

if(editingId){
const w = workers.find(x => x.id === editingId);
if(w) Object.assign(w, data);
} else {
const w = blankWorker();
Object.assign(w, data);
w.id = nextId();
w.createdAt = today();
workers.unshift(w);
}

save();
closeModal();
render();
}

/* ---------- Delete ---------- */
function removeWorker(id){
const w = workers.find(x => x.id === id);
if(!w) return;
if(!confirm(`Delete worker "${w.name}" (${w.id})?\n\nThis cannot be undone.`)) return;
workers = workers.filter(x => x.id !== id);
save();
render();
}

/* =========================================================
IMPORT / EXPORT
========================================================= */
function exportJSON(){
download(
'sol-workers-' + today() + '.json',
JSON.stringify(workers, null, 2),
'application/json'
);
}

function exportCSV(){
const head = [
'ID','Name','Passport','Nationality','Gender','DOB','Phone','Email',
'Employer','Job','Agent','Status','Progress','Current Stage',
...STAGES.map(s => s.label + ' (date)'),
'Notes'
];

const rows = workers.map(w => {
const p = progressOf(w);
const st = statusOf(w);
return [
w.id, w.name, w.passportNo, w.nationality, w.gender, w.dob, w.phone, w.email,
w.employer, w.job, w.agent, st.label,
p.done + '/' + STAGES.length, currentStage(w),
...STAGES.map(s => w.stages[s.key].date || ''),
w.notes
];
});

const csv = [head, ...rows]
.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(','))
.join('\r\n');

download('sol-workers-' + today() + '.csv', '\uFEFF' + csv, 'text/csv;charset=utf-8');
}

function importJSON(file){
const reader = new FileReader();
reader.onload = e => {
try {
const parsed = JSON.parse(e.target.result);
if(!Array.isArray(parsed)) throw new Error('File must contain an array of workers.');

let added = 0, updated = 0;
parsed.map(normalize).forEach(incoming => {
if(!incoming.name) return;
const existing = incoming.id ? workers.find(w => w.id === incoming.id) : null;
if(existing){ Object.assign(existing, incoming); updated++; }
else {
if(!incoming.id) incoming.id = nextId();
incoming.createdAt = incoming.createdAt || today();
workers.push(incoming);
added++;
}
});

save();
render();
alert(`Import complete.\nAdded: ${added}\nUpdated: ${updated}`);
} catch(err){
alert('Import failed: ' + err.message);
}
};
reader.readAsText(file);
}

/* =========================================================
EVENT WIRING
========================================================= */
function initFilters(){
const sel = $('#filterStage');
STAGES.forEach(s => {
const o = document.createElement('option');
o.value = s.key;
o.textContent = 'Pending: ' + s.label;
sel.appendChild(o);
});
}

function bindEvents(){
/* Top bar */
$('#btnAdd').addEventListener('click', () => openModal(null));
$('#btnExport').addEventListener('click', exportJSON);
$('#btnCsv').addEventListener('click', exportCSV);
$('#btnPrint').addEventListener('click', () => window.print());
$('#btnImport').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', e => {
const f = e.target.files[0];
if(f) importJSON(f);
e.target.value = '';
});

/* Filters */
$('#search').addEventListener('input', e => {
filters.q = e.target.value;
renderTable();
});
$('#filterStage').addEventListener('change', e => {
filters.stage = e.target.value;
renderTable();
});
$('#filterStatus').addEventListener('change', e => {
filters.status = e.target.value;
renderTable();
});

/* Table actions */
$('#tbody').addEventListener('click', e => {
const btn = e.target.closest('button[data-act]');
if(!btn) return;
const id = btn.dataset.id;
if(btn.dataset.act === 'edit') openModal(id);
if(btn.dataset.act === 'del') removeWorker(id);
});

/* Modal buttons */
$('#btnClose').addEventListener('click', closeModal);
$('#btnCancel').addEventListener('click', closeModal);
$('#btnSave').addEventListener('click', saveWorker);
$('#modal').addEventListener('mousedown', e => {
if(e.target === $('#modal')) closeModal();
});
document.addEventListener('keydown', e => {
if(e.key === 'Escape' && $('#modal').classList.contains('open')) closeModal();
});

/* Live stage toggle: highlight row + auto-fill date */
$('#modalBody').addEventListener('change', e => {
if(e.target.matches('input[type=checkbox][data-stage]')){
const row = e.target.closest('.stage-row');
row.classList.toggle('done', e.target.checked);
const dateInput = row.querySelector('input[type=date]');
if(e.target.checked && !dateInput.value) dateInput.value = today();
}
});
}

/* ---------- Boot ---------- */
load();
initFilters();
bindEvents();
render();
</script>
</body>
</html>
